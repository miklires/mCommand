name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew clean build --no-daemon
      - name: Update Modrinth project metadata
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          jq -n --rawfile body README.md '{
            title: "mCommand",
            description: "Lightweight modular administration commands for Paper, Purpur, and Folia.",
            body: $body,
            categories: ["management", "utility"],
            source_url: "https://github.com/miklires/mCommand",
            issues_url: "https://github.com/miklires/mCommand/issues",
            wiki_url: "https://miklires.su/wiki/mcommand",
            discord_url: "https://discord.gg/pes25cnWKy",
            donation_urls: [{id: "other", platform: "Other", url: "https://miklires.su/support"}],
            license_id: "MIT"
          }' > modrinth-project.json
          curl --fail-with-body --request PATCH \
            --header "Authorization: $MODRINTH_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @modrinth-project.json \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID"
      - run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
      - uses: softprops/action-gh-release@v3
        with:
          files: build/libs/mCommand-1.1.0.jar
          body_path: CHANGELOG.md
