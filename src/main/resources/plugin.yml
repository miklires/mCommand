name: mCommand
version: ${version}
main: io.github.miklires.mcommand.MCommand
api-version: '26.2'
author: miklires
description: A lightweight modular administration toolkit
folia-supported: true

permissions:
  mcommand.admin:
    description: All mCommand administration permissions
    default: op
    children:
      mcommand.commands: true
      mcommand.command.sudo.other: true
      mcommand.command.sudo.console: true
      mcommand.command.invsee.modify: true
      mcommand.command.invsee.offline: true
      mcommand.command.gm.other: true
      mcommand.command.clear.other: true
      mcommand.command.fly.other: true
      mcommand.command.god.other: true
      mcommand.command.heal.other: true
      mcommand.command.feed.other: true
      mcommand.command.ext.other: true
      mcommand.command.tp.other: true
      mcommand.command.vanish.other: true
      mcommand.command.whois.ip: true
      mcommand.format.unsafe: true
      mcommand.exempt.bypass: true
      mcommand.vanish.see: true
  mcommand.commands:
    description: All base mCommand commands
    default: op
    children:
      mcommand.command.fly: true
      mcommand.command.god: true
      mcommand.command.heal: true
      mcommand.command.feed: true
      mcommand.command.repair: true
      mcommand.command.speed: true
      mcommand.command.speed.max.10: true
      mcommand.command.ext: true
      mcommand.command.gm.survival: true
      mcommand.command.gm.creative: true
      mcommand.command.gm.adventure: true
      mcommand.command.gm.spectator: true
      mcommand.command.invsee: true
      mcommand.command.endersee: true
      mcommand.command.freeze: true
      mcommand.command.unfreeze: true
      mcommand.command.vanish: true
      mcommand.command.sudo: true
      mcommand.command.broadcast: true
      mcommand.command.clearchat: true
      mcommand.command.ec: true
      mcommand.command.top: true
      mcommand.command.back: true
      mcommand.command.hat: true
      mcommand.command.anvil: true
      mcommand.command.wb: true
      mcommand.command.grindstone: true
      mcommand.command.cartography: true
      mcommand.command.loom: true
      mcommand.command.smithing: true
      mcommand.command.clear: true
      mcommand.command.skull: true
      mcommand.command.itemname: true
      mcommand.command.lore: true
      mcommand.command.tp: true
      mcommand.command.tphere: true
      mcommand.command.tppos: true
      mcommand.command.tpall: true
      mcommand.command.day: true
      mcommand.command.night: true
      mcommand.command.sun: true
      mcommand.command.rain: true
      mcommand.command.ping: true
      mcommand.command.seen: true
      mcommand.command.playtime: true
      mcommand.command.near: true
      mcommand.command.whois: true
      mcommand.command.serverinfo: true
      mcommand.command.staff: true
  mcommand.command.sudo.self: { default: op }
  mcommand.command.sudo.other: { default: op }
  mcommand.command.sudo.console: { default: op }
  mcommand.command.invsee.modify: { default: op }
  mcommand.command.invsee.offline: { default: op }
  mcommand.command.gm.other: { default: op }
  mcommand.command.clear.other: { default: op }
  mcommand.command.fly.other: { default: op }
  mcommand.command.god.other: { default: op }
  mcommand.command.heal.other: { default: op }
  mcommand.command.feed.other: { default: op }
  mcommand.command.ext.other: { default: op }
  mcommand.command.tp.other: { default: op }
  mcommand.command.vanish.other: { default: op }
  mcommand.command.whois.ip: { default: op }
  mcommand.format.unsafe: { default: op }
  mcommand.exempt.invsee: { default: false }
  mcommand.exempt.sudo: { default: false }
  mcommand.exempt.freeze: { default: false }
  mcommand.exempt.bypass: { default: op }
  mcommand.vanish.see: { default: op }
  mcommand.command.speed.max.10:
    description: Allow speed values up to 10
    default: op
    children:
      mcommand.command.speed.max.9: true
      mcommand.command.speed.max.8: true
      mcommand.command.speed.max.7: true
      mcommand.command.speed.max.6: true
      mcommand.command.speed.max.5: true
      mcommand.command.speed.max.4: true
      mcommand.command.speed.max.3: true
      mcommand.command.speed.max.2: true
      mcommand.command.speed.max.1: true
